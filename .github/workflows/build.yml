# 이미지 빌드 → Artifact Registry (deploy/README.md §5-2, §11)
#
# main 또는 dev 에 푸시할 때마다 api·web 두 이미지를 만들어
#   asia-northeast3-docker.pkg.dev/ssanecting/ssafy-net/{api,web}:<짧은 sha>
# 로 올리고, 브랜치의 이동 태그도 붙인다: main → latest(운영 VM 이 따라간다), dev → dev(개발 VM 이 따라간다).
# 각 VM 의 cron(deploy/auto-deploy.sh)이 자기 태그의 지문이 바뀌면 받아 띄운다. VM(4GB)에서는 빌드하지 않는다.
#
# 필요한 secret: GCP_SA_KEY — 서비스 계정 gh-actions 의 JSON 키 전체 (README §5-2).
# 문서만 바뀐 커밋은 빌드하지 않는다(paths-ignore). 그 sha 로는 이미지가 없으니 이동 태그나 직전 sha 를 쓴다.
# 빌드 안에서 tsc·nest build 가 돌므로 타입 검사를 겸한다. 빨간불이면 VM 에 닿기 전에 잡힌 것이다.

name: build-images

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'design/**'
      - 'history/**'
      - 'phase0-mvp/**'
  workflow_dispatch:

env:
  REGISTRY: asia-northeast3-docker.pkg.dev
  IMAGE_REPO: asia-northeast3-docker.pkg.dev/ssanecting/ssafy-net

# 브랜치마다 같은 시간에 하나만. 연달아 푸시하면 순서대로 돈다(이동 태그가 뒤바뀌지 않게). main 과 dev 는 서로 기다리지 않는다.
concurrency:
  group: build-images-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: secret 확인
        env:
          KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::GCP_SA_KEY secret 이 없다. deploy/README.md §5-2 를 따라 넣고 다시 실행한다"
            exit 1
          fi

      # sha 태그는 커밋마다, 이동 태그는 브랜치마다. main → latest, 그 밖(dev) → 브랜치 이름.
      - id: meta
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "channel=latest" >> "$GITHUB_OUTPUT"
          else
            echo "channel=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      # 두 타깃이 deps·build 단계를 공유한다. 캐시(type=gha) 덕에 두 번째부터는 2분 안팎.
      # 라벨의 커밋은 VM 의 deploy.sh 가 "무엇이 올라갔나"를 적는 데 쓴다.
      #
      # 빌드 단계에서는 sha 태그만 붙인다. 이동 태그(latest·dev)는 둘 다 만들어진 뒤 마지막에 한꺼번에 붙인다 —
      # VM 의 cron 이 이동 태그의 지문을 보고 배포하는데, api 에만 먼저 붙이면 그 사이에 낀 cron 이
      # 새 api + 옛 web 으로 띄우고 만다(2026-09-10 개발 서버가 그랬다).
      - name: api image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          provenance: false
          tags: ${{ env.IMAGE_REPO }}/api:${{ steps.meta.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          provenance: false
          tags: ${{ env.IMAGE_REPO }}/web:${{ steps.meta.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 두 이미지가 다 올라간 뒤에 이동 태그를 붙인다. 레지스트리에 매니페스트만 하나 더 가리키게 하는 것이라
      # 받아 올리지 않고 1초 안에 끝나, VM 의 cron 이 그 틈에 낄 여지가 사실상 없다.
      # 그래도 어긋나면 VM 쪽에서 잡는다 — auto-deploy.sh 가 api·web 지문을 둘 다 본다.
      - name: 이동 태그
        env:
          REPO: ${{ env.IMAGE_REPO }}
          SHA: ${{ steps.meta.outputs.sha }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
        run: |
          for name in api web; do
            docker buildx imagetools create \
              --tag "$REPO/$name:$CHANNEL" "$REPO/$name:$SHA"
          done

      - name: 요약
        env:
          CHANNEL: ${{ steps.meta.outputs.channel }}
          SHA: ${{ steps.meta.outputs.sha }}
          TARGET: ${{ github.ref_name == 'main' && '운영 서버(ssafy-networking.store)' || '개발 서버(dev.ssafy-networking.store)' }}
        run: |
          {
            echo "### 올린 이미지 — \`${CHANNEL}\` (${TARGET})"
            echo
            echo "- \`${IMAGE_REPO}/api:${SHA}\` = \`:${CHANNEL}\`"
            echo "- \`${IMAGE_REPO}/web:${SHA}\` = \`:${CHANNEL}\`"
            echo
            echo "${TARGET}의 자동 배포(auto-deploy.sh)가 2분 안에 \`${CHANNEL}\` 을 받아 띄운다. 손으로 하거나 이 커밋에 고정하려면 그 VM 에서:"
            echo
            echo '```bash'
            echo "IMAGE_TAG=${SHA} ./deploy/deploy.sh   # 고정(자동 배포 멈춤). 태그 없이 돌리면 ${CHANNEL} + 재개"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
