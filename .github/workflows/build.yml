# 이미지 빌드 → Artifact Registry (deploy/README.md §5-2)
#
# main 에 푸시할 때마다 api·web 두 이미지를 만들어
#   asia-northeast3-docker.pkg.dev/ssanecting/ssafy-net/{api,web}:<짧은 sha>  와  :latest
# 로 올린다. VM 은 ./deploy/deploy.sh 로 받아 띄운다. VM(4GB)에서는 빌드하지 않는다.
#
# 필요한 secret: GCP_SA_KEY — 서비스 계정 gh-actions 의 JSON 키 전체 (README §5-2).
# 문서만 바뀐 커밋은 빌드하지 않는다(paths-ignore). 그 sha 로는 이미지가 없으니 latest 나 직전 sha 를 쓴다.
# 빌드 안에서 tsc·nest build 가 돌므로 타입 검사를 겸한다. 빨간불이면 VM 에 닿기 전에 잡힌 것이다.

name: build-images

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'design/**'
      - 'history/**'
      - 'phase0-mvp/**'
  workflow_dispatch:

env:
  REGISTRY: asia-northeast3-docker.pkg.dev
  IMAGE_REPO: asia-northeast3-docker.pkg.dev/ssanecting/ssafy-net

# 같은 시간에 하나만. 연달아 푸시하면 순서대로 돈다(latest 가 뒤바뀌지 않게).
concurrency:
  group: build-images
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: secret 확인
        env:
          KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::GCP_SA_KEY secret 이 없다. deploy/README.md §5-2 를 따라 넣고 다시 실행한다"
            exit 1
          fi

      - id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      # 두 타깃이 deps·build 단계를 공유한다. 캐시(type=gha) 덕에 두 번째부터는 2분 안팎.
      - name: api image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_REPO }}/api:${{ steps.meta.outputs.sha }}
            ${{ env.IMAGE_REPO }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_REPO }}/web:${{ steps.meta.outputs.sha }}
            ${{ env.IMAGE_REPO }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 요약
        run: |
          {
            echo "### 올린 이미지"
            echo
            echo "- \`${IMAGE_REPO}/api:${{ steps.meta.outputs.sha }}\`"
            echo "- \`${IMAGE_REPO}/web:${{ steps.meta.outputs.sha }}\`"
            echo
            echo "VM 에서:"
            echo
            echo '```bash'
            echo "IMAGE_TAG=${{ steps.meta.outputs.sha }} ./deploy/deploy.sh   # 또는 태그 없이 latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
