services:
  db:
    image: postgres:16
    container_name: ssafy-net-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ssafynet
      POSTGRES_PASSWORD: ssafynet
      POSTGRES_DB: ssafynet
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssafynet -d ssafynet"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
